<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanchuki AI Studio — Effects Catalog</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .serif { font-family: 'Marcellus', serif; }
  .chip { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #F5F3FF; color: #6D28D9; border: 1px solid #DDD6FE; }
  .chip.g { background:#ECFDF5; color:#047857; border-color:#A7F3D0; }
  .chip.a { background:#FFFBEB; color:#B45309; border-color:#FDE68A; }
  .tab.on { background:#231F48; color:#fff; }
  .nophoto { background: repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 10px,#e5e7eb 10px,#e5e7eb 20px); }
</style>
</head>
<body class="bg-[#F8F7FC] text-[#231F48] min-h-screen">

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-[#E0E1F6] px-6 py-3">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="serif text-xl font-extrabold">Kanchuki AI Studio — Effects</h1>
      <p class="text-xs text-[#6B4773]">Pick a product (simulates the AI tag) → effects load by audience &amp; garment. <span id="stats"></span></p>
    </div>
    <button onclick="exportManifest()" class="px-4 py-2 rounded-xl bg-[#231F48] text-white text-xs font-bold hover:bg-[#BB3F95]">Export preview manifest (JSON)</button>
  </div>
</header>

<div class="max-w-7xl mx-auto px-6 py-5 grid lg:grid-cols-[320px_1fr] gap-6">

  <!-- ── Left: AI-tag simulator ── -->
  <aside class="space-y-4 lg:sticky lg:top-20 self-start">
    <div class="bg-white rounded-2xl border border-[#E0E1F6] p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">1 · Sample product (AI tag)</h2>
      <div id="prodGrid" class="grid grid-cols-4 gap-1.5 max-h-72 overflow-y-auto"></div>
      <div class="grid grid-cols-2 gap-2 mt-3 text-xs">
        <label>Audience<select id="selAud" onchange="manual()" class="w-full mt-1 p-1.5 rounded-lg border border-[#E0E1F6]"></select></label>
        <label>Garment<select id="selCls" onchange="manual()" class="w-full mt-1 p-1.5 rounded-lg border border-[#E0E1F6]"></select></label>
      </div>
      <div id="tagChips" class="flex flex-wrap gap-1 mt-3"></div>
    </div>
    <div class="bg-white rounded-2xl border border-[#E0E1F6] p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">2 · Model type</h2>
      <div id="modelGrid" class="grid grid-cols-3 gap-2"></div>
      <label id="seniorRow" class="hidden mt-3 text-xs flex items-center gap-2"><input type="checkbox" id="senior" onchange="render()"> Senior look (60+)</label>
    </div>
  </aside>

  <!-- ── Right: effects ── -->
  <main>
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <button class="tab px-5 py-2 rounded-2xl text-sm font-bold bg-gray-100" data-m="model" onclick="setMode('model')">🧍 Model Only</button>
      <button class="tab px-5 py-2 rounded-2xl text-sm font-bold bg-gray-100" data-m="product" onclick="setMode('product')">👕 Product Only</button>
      <span class="w-px h-6 bg-gray-300 mx-1"></span>
      <button class="env px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-100" data-e="all" onclick="setEnv('all')">All</button>
      <button class="env px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-100" data-e="indoor" onclick="setEnv('indoor')">Indoor</button>
      <button class="env px-3 py-1.5 rounded-xl text-xs font-bold bg-gray-100" data-e="outdoor" onclick="setEnv('outdoor')">Outdoor</button>
    </div>
    <div id="notice"></div>
    <div id="results"></div>
  </main>
</div>

<!-- ── Modal ── -->
<div id="modal" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[92vh] overflow-y-auto p-6 relative">
    <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 font-bold">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="fixed bottom-6 right-6 bg-[#231F48] text-white px-4 py-2 rounded-xl text-xs font-semibold opacity-0 transition-opacity z-50">Copied</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA — every photo below is a REAL file under effect-photos/.
// Previews (effect-photos/previews/<CODE>.jpg) are generated later
// on the admin bench; a missing file shows a placeholder, never a fake.
// ═══════════════════════════════════════════════════════════════
const AUD = { womens:'Women', mens:'Men', teen_girl:'Teen girl', teen_boy:'Teen boy', kids_girl:'Kid girl', kids_boy:'Kid boy' };
const AUD_DESC = { womens:'an Indian woman in her early 30s', mens:'an Indian man in his mid 30s', teen_girl:'an Indian teenage girl (about 16)', teen_boy:'an Indian teenage boy (about 18)', kids_girl:'a 4-year-old Indian girl', kids_boy:'a 4-year-old Indian boy' };
const SENIOR_DESC = { womens:'an Indian woman in her 60s with silver-streaked hair', mens:'an Indian man in his 70s with a trimmed white beard' };
const CLS = { top:'Top / T-shirt / Shirt', kurti:'Kurti', shorts:'Shorts', pant:'Pant', suit:'Suit set', saree:'Saree', lehenga:'Lehenga', dress:'Dress / Set', unstitched:'Unstitched material' };
const HALF = new Set(['top','kurti','shorts']);   // half-body garments (owner rule)

// audience = the model tile shown; file under effect-photos/models/
const MODELS = [
  { f:'woman-30', aud:'womens', label:'Woman · 30' }, { f:'woman-60', aud:'womens', label:'Woman · 60', senior:true },
  { f:'man-35', aud:'mens', label:'Man · 35' },       { f:'man-70', aud:'mens', label:'Man · 70', senior:true },
  { f:'teen-girl-16', aud:'teen_girl', label:'Teen girl · 16' }, { f:'teen-boy-18', aud:'teen_boy', label:'Teen boy · 18' },
  { f:'kid-girl-4', aud:'kids_girl', label:'Girl · 4' }, { f:'kid-boy-4', aud:'kids_boy', label:'Boy · 4' },
];

// audience/cls are the simulated AI tags. boy-*/girl-* audience is my assumption (kid) — edit here.
const PRODUCTS = [
  ['w-kurti-pink-embroidered','Kurti · pink','womens','kurti'], ['w-kurti-mustard','Kurti · mustard','womens','kurti'],
  ['w-kurti-green','Kurti · green','womens','kurti'], ['w-shirt-grey','Shirt · grey','womens','top'],
  ['w-anarkali-orange','Anarkali · orange','womens','suit'], ['w-suit-blue','Suit · blue','womens','suit'],
  ['w-suit-coral','Suit · coral','womens','suit'], ['w-suit-yellow','Suit · yellow','womens','suit'],
  ['w-lehenga-pink','Lehenga · pink','womens','lehenga'], ['w-saree-green','Saree · green','womens','saree'],
  ['w-unstitched-white','Unstitched · white','womens','unstitched'], ['w-unstitched-blue','Unstitched · blue','womens','unstitched'],
  ['w-kurta-palazzo-mustard-worn','Kurta set · worn (test)','womens','suit',1], ['w-kurta-palazzo-pink-worn','Kurta set · worn (test)','womens','suit',1],
  ['b-shirt','Shirt · boy','kids_boy','top'], ['b-tshirt','T-shirt · boy','kids_boy','top'], ['b-sweater','Sweater · boy','kids_boy','top'],
  ['b-shorts','Shorts · boy','kids_boy','shorts'], ['b-pant','Pant · boy','kids_boy','pant'],
  ['g-top-bear','Tee · girl','kids_girl','top'], ['g-dress-1','Dress · girl','kids_girl','dress'],
  ['g-dress-2','Dress · girl','kids_girl','dress'], ['g-set-pinafore','Pinafore set · girl','kids_girl','dress'],
].map(([f,label,aud,cls,worn]) => ({ f, label, aud, cls, worn: !!worn }));

// ── Axes (short clauses; prompts are composed from these) ──
// scene: [title, env, group, clause]
const SCENE = {
  white_studio:   ['Pure White Studio','indoor','Studio','a seamless pure-white studio backdrop'],
  grey_studio:    ['Grey Softbox Studio','indoor','Studio','a seamless soft grey-beige studio backdrop'],
  beige_studio:   ['Warm Beige Studio','indoor','Studio','a seamless warm beige studio backdrop'],
  luxury_studio:  ['Premium Luxury Studio','indoor','Studio','a premium dark-toned luxury studio with polished floor and subtle gold accents'],
  editorial:      ['Vogue Editorial Studio','indoor','Studio','a dark seamless editorial studio backdrop'],
  marketplace:    ['Marketplace White','indoor','Studio','a clean e-commerce pure-white background with soft grounding shadow'],
  indian_home:    ['Indian Home','indoor','Indian','a warm Indian home interior with a wooden console, cosy sofa and potted plant softly out of focus'],
  festive_diya:   ['Festive Diya Glow','indoor','Indian','a festive Diwali interior with glowing brass diyas, marigold garlands and drifting golden bokeh, a few rose petals scattered'],
  boutique:       ['Boutique','indoor','Commercial','a chic boutique with clothing racks softly out of focus'],
  runway:         ['Catwalk Runway','indoor','Commercial','a high-fashion catwalk runway with overhead spotlights and a blurred audience'],
  marble:         ['Marble Hall','indoor','Luxury','an elegant marble-clad luxury interior with subtle gold accents softly out of focus'],
  rose_garden:    ['Royal Garden','outdoor','Nature','a lush Mughal garden with marble fountains and exotic florals'],
  mountain:       ['Himalayan Resort','outdoor','Nature','a Himalayan mountain resort with pines and misty peaks'],
  golden_field:   ['Golden Hour Greenery','outdoor','Nature','open soft-blurred greenery at golden hour'],
  modern_wall:    ['Contemporary Wall','outdoor','Urban','a modern contemporary street wall with clean architectural lines'],
  rooftop_cafe:   ['Rooftop Cafe','outdoor','Urban','a chic rooftop cafe with warm string lights and city bokeh'],
  park:           ['Sunny Park','outdoor','Urban','a sunny neighbourhood park with soft green grass and a gentle playground blur'],
  heritage_street:['Jaipur Heritage Street','outdoor','Heritage','a Jaipur heritage street wall of pink sandstone with carved jharokha windows'],
  palace:         ['Royal Palace Courtyard','outdoor','Heritage','a royal palace courtyard with ornate arches and sandstone pillars'],
  beach:          ['Goa Sunset Beach','outdoor','Resort','a Goa beach at sunset with soft waves'],
};
const POSE = {
  standing:['Standing','in a confident relaxed standing pose'], sitting:['Sitting','seated elegantly, torso turned slightly to camera'],
  walking:['Walking','mid-stride walking toward the camera with a slight natural fabric sway'], turning:['Turning','turning from three-quarter back to face the lens'],
  looking_back:['Looking back','looking back over the shoulder'], twirl:['Twirl','mid-twirl, the garment flaring open in a circle'],
  hold_dupatta:['Holding dupatta','gently holding the dupatta with one hand'], dupatta_flow:['Dupatta flow','the dupatta/pallu lifted by a light breeze, floating outward'],
  adjust_dupatta:['Adjusting dupatta','adjusting the dupatta drape with both hands'], candid:['Candid','in a natural unposed candid moment, mid-smile'],
  breeze:['Breeze','hair and loose fabric drifting in a gentle breeze, otherwise still'], mirror:['Mirror selfie','taking a casual full-length mirror selfie, phone in one hand'],
  playing:['Playing','playing happily with natural childlike movement'],
};
const LIGHT = {
  natural:['Natural light','soft natural daylight'], soft:['Soft light','soft diffused light'], window:['Window light','soft window light from one side'],
  golden:['Golden hour','warm golden-hour light'], sunset:['Sunset','a low warm sunset glow'], daylight:['Daylight','bright even daylight'],
  studio:['Studio light','clean studio strobe lighting'], softbox:['Softbox','a large softbox key light at eye level with subtle fill'],
  dramatic:['Dramatic','dramatic directional light with deep shadows'], cinematic:['Cinematic','cinematic light with gentle warm-cool contrast'],
  rim:['Rim light','rim light outlining the shoulders'], highkey:['High key','bright high-key lighting with minimal shadows'], lowkey:['Low key','moody low-key lighting'],
};
const FRAME = {
  full:['Full body','full-body shot, head to feet'], three_q:['Three-quarter','three-quarter shot, head to knee'],
  half:['Half body','waist-up only, head to hip'], close:['Close-up','tight chest-up close-up'], product:['Product','centred, entire product visible'],
};
const PRES = {
  mannequin:['Mannequin','on a plain headless mannequin'], ghost:['Ghost mannequin','as an invisible-mannequin shot, holding its worn 3D shape with no body'],
  flatlay:['Flat lay','neatly flat-laid and shot top-down'], hanger:['Hanger','on a wooden hanger'], folded:['Folded','neatly folded'],
  styled:['Styled display','as a styled display with subtle props'], plain:['Product only','as a clean product-only shot'],
  macro:['Macro detail','as a macro close-up of the fabric and embroidery'], rail:['Boutique rail','hung on a boutique rail'], surface:['On surface','laid on a polished marble surface'],
  bench:['On bench','arranged on a wooden garden bench'],
};

const ALL = 'all', K = ['kids_girl','kids_boy'];
// [code, title, mode, scene, pose|pres, light, frame, fit(cls[]|'all'), aud(null|[]), pri]
// Indoor presets are "combo" (pose/presentation + lighting overridable, AI recommends);
// outdoor presets are fixed single effects.
const RAW = [
 // ── MODEL · INDOOR ──
 ['M_WHITE_STUDIO','White Studio Standing','model','white_studio','standing','softbox','full',ALL,null,2],
 ['M_GREY_SOFTBOX','Grey Softbox Studio','model','grey_studio','standing','softbox','full',ALL,null,3],
 ['M_BEIGE_TURN','Beige Studio Turn','model','beige_studio','turning','soft','full',['suit','lehenga','saree','dress'],null,2],
 ['M_LUXURY_STUDIO','Luxury Studio','model','luxury_studio','standing','dramatic','full',['suit','lehenga','saree','dress'],null,3],
 ['M_EDITORIAL_FULL','Editorial Full Look','model','editorial','looking_back','rim','full',['suit','lehenga','saree','dress'],null,1],
 ['M_EDITORIAL_CLOSE','Editorial Close-Up','model','editorial','standing','rim','half',['top','kurti'],null,3],
 ['M_HOME_CANDID','Home Candid','model','indian_home','candid','window','full',['suit','saree','dress','pant'],null,2],
 ['M_MIRROR_SELFIE','Home Mirror Selfie','model','indian_home','mirror','window','full',['suit','dress','pant'],null,1],
 ['M_SEATED_SOFA','Seated Lounge','model','indian_home','sitting','window','full',['suit','saree','lehenga','dress'],null,2],
 ['M_BOUTIQUE_WALK','Boutique Walk','model','boutique','walking','soft','full',ALL,null,1],
 ['M_RUNWAY','Catwalk Runway','model','runway','walking','dramatic','full',['lehenga','saree','suit','dress'],null,2],
 ['M_MARBLE_LUXURY','Marble Luxury','model','marble','standing','soft','full',['saree','lehenga','suit'],null,3],
 ['M_FESTIVE_DIYA','Festive Diya Glow','model','festive_diya','hold_dupatta','cinematic','full',['suit','lehenga','saree','dress'],null,2],
 ['M_DUPATTA_FLOW','Dupatta Flow','model','beige_studio','dupatta_flow','softbox','full',['suit','lehenga','saree'],null,3],
 ['M_TWIRL_FLARE','Twirl Flare','model','white_studio','twirl','highkey','full',['lehenga','dress','suit'],null,2],
 ['M_LOOK_BACK','Shoulder Glance','model','beige_studio','looking_back','soft','three_q',['saree','lehenga','suit','dress'],null,1],
 ['M_HALF_STUDIO','Half-Body Studio','model','white_studio','standing','softbox','half',['top','kurti','shorts'],null,3],
 ['M_HALF_HOME','Half-Body Home','model','indian_home','candid','window','half',['top','kurti'],null,2],
 ['M_HALF_BEIGE','Half-Body Turn','model','beige_studio','turning','soft','half',['top','kurti','shorts'],null,2],
 ['M_HALF_BOUTIQUE','Half-Body Boutique','model','boutique','candid','soft','half',['top','kurti'],null,1],
 ['M_KIDS_HOME_PLAY','Kids Home Play','model','indian_home','playing','natural','full',ALL,K,3],
 ['M_KIDS_STUDIO','Kids Bright Studio','model','white_studio','candid','highkey','full',ALL,K,2],
 ['M_MENS_LOUNGE','Gentleman Lounge','model','luxury_studio','sitting','cinematic','full',ALL,['mens','teen_boy'],2],
 // ── MODEL · OUTDOOR (fixed) ──
 ['O_ROYAL_GARDEN','Royal Garden Walk','model','rose_garden','walking','daylight','full',['suit','lehenga','saree','dress'],null,2],
 ['O_HERITAGE_STREET','Jaipur Heritage Street','model','heritage_street','standing','daylight','full',['suit','lehenga','saree','dress','kurti'],null,2],
 ['O_PALACE_COURT','Palace Courtyard','model','palace','standing','golden','full',['lehenga','saree','suit'],null,2],
 ['O_GOLDEN_HOUR','Golden Hour Outdoor','model','golden_field','turning','golden','full',ALL,null,3],
 ['O_BEACH_SUNSET','Goa Sunset Beach','model','beach','walking','sunset','full',['dress','suit','pant','shorts'],null,1],
 ['O_MOUNTAIN','Himalayan Resort','model','mountain','standing','daylight','full',['dress','suit','pant'],null,1],
 ['O_ROOFTOP_CAFE','Rooftop Cafe','model','rooftop_cafe','sitting','soft','full',['dress','suit','pant'],null,1],
 ['O_URBAN_WALL','Contemporary Wall','model','modern_wall','candid','daylight','full',['dress','pant','suit'],null,2],
 ['O_HALF_URBAN','Half-Body Street','model','modern_wall','candid','natural','half',['top','kurti','shorts'],null,2],
 ['O_HALF_CAFE','Half-Body Cafe','model','rooftop_cafe','candid','soft','half',['top','kurti'],null,1],
 ['O_KIDS_PARK','Kids Park Play','model','park','playing','daylight','full',ALL,K,3],
 // ── PRODUCT · INDOOR ──
 ['P_MANNEQUIN','Mannequin','product','white_studio','mannequin','softbox','product',['suit','saree','lehenga','dress','pant','kurti','top'],null,3],
 ['P_GHOST','Ghost Mannequin','product','white_studio','ghost','softbox','product',['top','kurti','suit','dress','pant','shorts'],null,3],
 ['P_FLATLAY','Flat Lay','product','beige_studio','flatlay','softbox','product',ALL,null,2],
 ['P_HANGER','Hanger','product','white_studio','hanger','window','product',['top','kurti','suit','dress','shorts','pant'],null,2],
 ['P_FOLDED','Folded','product','beige_studio','folded','soft','product',['top','kurti','shorts','pant','saree','unstitched'],null,1],
 ['P_STYLED','Styled Display','product','indian_home','styled','window','product',ALL,null,2],
 ['P_MARKETPLACE','Marketplace Product Only','product','marketplace','plain','highkey','product',ALL,null,3],
 ['P_MACRO','Macro Fabric Detail','product','white_studio','macro','softbox','close',ALL,null,1],
 ['P_BOUTIQUE_RAIL','Boutique Rail','product','boutique','rail','soft','product',['top','kurti','suit','dress','pant'],null,1],
 ['P_LUXURY_SURFACE','Luxury Marble Surface','product','marble','surface','soft','product',['suit','saree','lehenga','unstitched'],null,2],
 // ── PRODUCT · OUTDOOR (fixed) ──
 ['P_GARDEN_BENCH','Garden Bench Display','product','rose_garden','bench','daylight','product',['suit','saree','unstitched','kurti','top'],null,1],
];
const PRESETS = RAW.map(([code,title,mode,sc,po,li,fr,fit,aud,pri]) => ({
  code, title, mode, sc, po, li, fr, fit, aud, pri,
  env: SCENE[sc][1], group: SCENE[sc][2], combo: SCENE[sc][1] === 'indoor',
}));

// ═══════════ State ═══════════
const S = { mode:'model', env:'all', prod:PRODUCTS[0], aud:PRODUCTS[0].aud, cls:PRODUCTS[0].cls };
const $ = id => document.getElementById(id);
// ponytail: uploaded outputs live in localStorage (this browser only), resized to ~60KB; permanent path = save into effect-photos/previews/
const saved = code => { try { return localStorage.getItem('fx:' + code); } catch { return null; } };
const img = (path, cls, alt) => `<img src="${(path.startsWith('previews/') && saved(path.slice(9))) || `effect-photos/${path}.jpg`}" alt="${alt}" class="${cls}" loading="lazy" onerror="this.outerHTML='<div class=&quot;nophoto ${cls} flex items-center justify-center text-[10px] text-gray-500 text-center p-2&quot;>no photo yet<br>${path}</div>'">`;

function fits(p, cls, aud) {
  if (p.fit !== ALL && !p.fit.includes(cls)) return false;
  if (p.aud && !p.aud.includes(aud)) return false;
  if (p.mode === 'model') {
    if (cls === 'unstitched') return false;
    if (HALF.has(cls) ? p.fr === 'full' || p.fr === 'three_q' : p.fr === 'half' || p.fr === 'close') return false;
  }
  return true;
}
function score(p, cls) { return p.pri + (p.fit !== ALL && p.fit.includes(cls) ? 2 : 0); }

// ═══════════ Prompt composer — the "combination" ═══════════
const GUARD = "The garment's exact colour, print, embroidery, fabric texture and original length are 100% preserved.";
const HALF_GUARD = "Do NOT show legs, hips-down or feet, and do NOT invent any trousers, palazzo, leggings or skirt not visible in the source photo.";
function compose(p, o) {
  const cls = CLS[o.cls].toLowerCase(), sc = SCENE[p.sc][3], li = LIGHT[o.li][1];
  if (p.mode === 'product')
    return `Present this ${cls} ${PRES[o.po][1]}, set in ${sc}. Lit by ${li}. ${FRAME[p.fr][1]}. ${GUARD}`;
  const who = o.senior && SENIOR_DESC[o.aud] ? SENIOR_DESC[o.aud] : AUD_DESC[o.aud];
  const sceneWord = p.env === 'indoor' ? 'in' : 'outdoors in';
  return `Place this ${cls} on ${who}, ${POSE[o.po][1]}, ${sceneWord} ${sc}. Lit by ${li}. ${FRAME[p.fr][1]}. ${HALF.has(o.cls) ? HALF_GUARD + ' ' : ''}${GUARD}`;
}
const opts = (p, over = {}) => ({ cls:S.cls, aud:S.aud, senior:$('senior').checked, po:p.po, li:p.li, ...over });

// ═══════════ Render ═══════════
function renderLeft() {
  $('prodGrid').innerHTML = PRODUCTS.map((p, i) => `
    <button onclick="pickProd(${i})" title="${p.label}" class="relative rounded-lg overflow-hidden border-2 ${p === S.prod ? 'border-[#BB3F95]' : 'border-transparent'}">
      ${img('products/' + p.f, 'w-full aspect-[3/4] object-cover', p.label)}${p.worn ? '<span class="absolute bottom-0 inset-x-0 bg-amber-500 text-white text-[8px] text-center">worn</span>' : ''}
    </button>`).join('');
  $('selAud').innerHTML = Object.entries(AUD).map(([k, v]) => `<option value="${k}" ${k === S.aud ? 'selected' : ''}>${v}</option>`).join('');
  $('selCls').innerHTML = Object.entries(CLS).map(([k, v]) => `<option value="${k}" ${k === S.cls ? 'selected' : ''}>${v}</option>`).join('');
  $('tagChips').innerHTML = `<span class="chip g">${AUD[S.aud]}</span><span class="chip">${CLS[S.cls]}</span><span class="chip a">${HALF.has(S.cls) ? 'half-body garment' : S.cls === 'unstitched' ? 'not wearable' : 'full-body garment'}</span>` + (S.prod && S.prod.aud === S.aud && S.prod.cls === S.cls && S.prod.worn ? '<span class="chip a">worn source — AI must ignore the person</span>' : '');
  const list = MODELS.filter(m => m.aud === S.aud);
  const hasSenior = list.some(m => m.senior);
  $('seniorRow').classList.toggle('hidden', !hasSenior);
  if (!hasSenior) $('senior').checked = false;
  const sel = list.filter(m => !!m.senior === $('senior').checked);
  $('modelGrid').innerHTML = sel.map(m => `<div>${img('models/' + m.f, 'w-full aspect-[3/4] object-cover rounded-lg', m.label)}<p class="text-[10px] text-center mt-1 font-semibold">${m.label}</p></div>`).join('');
}

function card(p, star) {
  return `<button onclick="openModal('${p.code}')" class="text-left bg-white rounded-2xl border ${star ? 'border-[#BB3F95]' : 'border-[#E0E1F6]'} overflow-hidden hover:shadow-lg transition">
    <div class="relative">${img('previews/' + p.code, 'w-full aspect-[3/4] object-cover', p.title)}
      ${star ? '<span class="absolute top-2 left-2 chip a">★ recommended</span>' : ''}
      <span class="absolute top-2 right-2 chip ${p.combo ? 'g' : ''}">${p.combo ? 'combo' : 'fixed'}</span></div>
    <div class="p-3"><p class="text-sm font-bold">${p.title}</p>
      <div class="flex flex-wrap gap-1 mt-1.5"><span class="chip">${p.env} · ${p.group}</span><span class="chip">${(p.mode === 'model' ? POSE : PRES)[p.po][0]}</span><span class="chip">${LIGHT[p.li][0]}</span><span class="chip">${FRAME[p.fr][0]}</span></div></div></button>`;
}

function render() {
  renderLeft();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
  document.querySelectorAll('.env').forEach(b => { const on = b.dataset.e === S.env; b.classList.toggle('bg-[#BB3F95]', on); b.classList.toggle('text-white', on); b.classList.toggle('bg-gray-100', !on); });
  const notes = [];
  if (S.mode === 'model' && S.cls === 'unstitched') notes.push('Unstitched material cannot be worn — use Product Only.');
  if (S.prod && S.prod.aud === S.aud && S.prod.cls === S.cls && S.prod.worn) notes.push('This sample already has a person wearing it (test case: AI must keep the garment, replace the person).');
  $('notice').innerHTML = notes.map(n => `<div class="mb-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800">${n}</div>`).join('');

  const pool = PRESETS.filter(p => p.mode === S.mode && fits(p, S.cls, S.aud) && (S.env === 'all' || p.env === S.env));
  const rec = pool.filter(p => p.combo).sort((a, b) => score(b, S.cls) - score(a, S.cls)).slice(0, 3);
  let html = '';
  if (rec.length) html += `<h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">★ Best for this product</h3><div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">${rec.map(p => card(p, true)).join('')}</div>`;
  for (const env of ['indoor', 'outdoor']) {
    const groups = [...new Set(pool.filter(p => p.env === env).map(p => p.group))];
    for (const g of groups) {
      const items = pool.filter(p => p.env === env && p.group === g);
      html += `<h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mt-4 mb-2">${env} · ${g} <span class="text-gray-400">(${items.length})</span></h3><div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">${items.map(p => card(p, false)).join('')}</div>`;
    }
  }
  $('results').innerHTML = html || '<p class="text-sm text-gray-500 py-10 text-center">No effects match this audience + garment.</p>';
  $('stats').textContent = `${PRESETS.length} effects total · ${pool.length} match this product`;
}

// ═══════════ Actions ═══════════
function pickProd(i) { S.prod = PRODUCTS[i]; S.aud = S.prod.aud; S.cls = S.prod.cls; if (S.cls === 'unstitched') S.mode = 'product'; render(); }
function manual() { S.aud = $('selAud').value; S.cls = $('selCls').value; S.prod = PRODUCTS.find(p => p.aud === S.aud && p.cls === S.cls) || S.prod; render(); }
function setMode(m) { S.mode = m; render(); }
function setEnv(e) { S.env = e; render(); }
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; setTimeout(() => el.style.opacity = 0, 1400); }

let cur = null, over = {};
function openModal(code) { cur = PRESETS.find(p => p.code === code); over = {}; drawModal(); $('modal').classList.replace('hidden', 'flex'); }
function closeModal() { $('modal').classList.replace('flex', 'hidden'); }
function uploadOut(file) {
  if (!file) return;
  const im = new Image();
  im.onload = () => {
    const r = Math.min(1, 720 / im.width), c = document.createElement('canvas');
    c.width = im.width * r; c.height = im.height * r; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    try { localStorage.setItem('fx:' + cur.code, c.toDataURL('image/jpeg', 0.8)); toast('Saved in this browser'); }
    catch { toast('Storage full — remove some uploads'); }
    drawModal(); render();
  };
  im.src = URL.createObjectURL(file);
}
function clearOut() { try { localStorage.removeItem('fx:' + cur.code); } catch {} drawModal(); render(); }
function setOver(k, v) { over[k] = v; $('modalPrompt').textContent = compose(cur, opts(cur, over)); }
function drawModal() {
  const p = cur, poseMap = p.mode === 'model' ? POSE : PRES, sel = (map, val, key) =>
    `<select onchange="setOver('${key}',this.value)" class="w-full mt-1 p-1.5 rounded-lg border border-[#E0E1F6] text-xs" ${p.combo ? '' : 'disabled'}>${Object.entries(map).map(([k, v]) => `<option value="${k}" ${k === val ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>`;
  $('modalBody').innerHTML = `
    <div class="grid sm:grid-cols-[220px_1fr] gap-5">
      <div>${img('previews/' + p.code, 'w-full aspect-[3/4] object-cover rounded-xl', p.title)}
        <p class="text-[10px] text-gray-400 mt-1">effect-photos/previews/${p.code}.jpg</p>
        <label class="block mt-2 text-center px-3 py-2 rounded-xl bg-[#BB3F95] text-white text-xs font-bold cursor-pointer">Upload output image<input type="file" accept="image/*" class="hidden" onchange="uploadOut(this.files[0])"></label>
        ${saved(p.code) ? `<a href="${saved(p.code)}" download="${p.code}.jpg" class="block mt-1.5 text-center text-[11px] font-semibold underline">Download as ${p.code}.jpg</a><button onclick="clearOut()" class="block mx-auto mt-1 text-[11px] text-gray-500 underline">Remove</button>` : ''}</div>
      <div>
        <p class="text-[10px] font-bold text-gray-400">${p.code}</p>
        <h2 class="serif text-2xl font-extrabold">${p.title}</h2>
        <div class="flex flex-wrap gap-1 mt-2"><span class="chip">${p.env} · ${p.group}</span><span class="chip">${SCENE[p.sc][0]}</span><span class="chip ${p.combo ? 'g' : ''}">${p.combo ? 'combo — override below' : 'fixed effect'}</span></div>
        <div class="grid grid-cols-2 gap-3 mt-4 text-xs font-semibold"><label>${p.mode === 'model' ? 'Pose / action' : 'Presentation'}${sel(poseMap, p.po, 'po')}</label><label>Lighting${sel(LIGHT, p.li, 'li')}</label></div>
        <p class="text-[11px] font-bold uppercase tracking-wider text-gray-500 mt-4 mb-1">Composed prompt · ${AUD[S.aud]} · ${CLS[S.cls]}</p>
        <p id="modalPrompt" class="text-xs leading-relaxed bg-[#F8F7FC] border border-[#E0E1F6] rounded-xl p-3">${compose(p, opts(p))}</p>
        <button onclick="navigator.clipboard.writeText($('modalPrompt').textContent).then(()=>toast('Prompt copied'))" class="mt-3 px-4 py-2 rounded-xl bg-[#231F48] text-white text-xs font-bold hover:bg-[#BB3F95]">Copy prompt</button>
        <p class="text-[11px] text-gray-500 mt-3">Fits: ${p.fit === ALL ? 'all garments' : p.fit.map(c => CLS[c]).join(', ')} · Audience: ${p.aud ? p.aud.map(a => AUD[a]).join(', ') : 'all'}</p>
      </div></div>`;
}

// ═══════════ Manifest for generating the preview photos on the admin bench ═══════════
function exportManifest() {
  const rows = PRESETS.map(p => {
    const aud = p.aud ? p.aud[0] : 'womens';
    const cls = (p.fit === ALL ? [...new Set(PRODUCTS.map(x => x.cls))] : p.fit).find(c => PRODUCTS.some(x => x.aud === aud && x.cls === c && !x.worn) && fits(p, c, aud));
    const prod = PRODUCTS.find(x => x.aud === aud && x.cls === cls && !x.worn);
    return { code: p.code, output: `effect-photos/previews/${p.code}.jpg`, mode: p.mode, env: p.env, group: p.group, audience: aud,
      product_photo: prod ? `effect-photos/products/${prod.f}.jpg` : null, garment_class: cls || null,
      prompt: prod ? compose(p, { cls, aud, senior: false, po: p.po, li: p.li }) : null,
      note: prod ? undefined : 'no sample product for this audience/garment yet' };
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' }));
  a.download = 'effects-preview-manifest.json'; a.click();
  toast(`Manifest: ${rows.filter(r => r.prompt).length}/${rows.length} ready, rest need a sample product`);
}

// ponytail: self-check — every preset references real axis ids
(function check() {
  for (const p of PRESETS) {
    console.assert(SCENE[p.sc] && LIGHT[p.li] && FRAME[p.fr] && (p.mode === 'model' ? POSE : PRES)[p.po], 'bad preset ' + p.code);
    console.assert(p.mode === 'product' || p.fit === ALL || p.fit.every(c => c in CLS), 'bad fit ' + p.code);
  }
})();
render();
</script>
</body>
</html>
