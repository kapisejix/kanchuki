# ffmpeg/ffprobe binaries for the spin-frame-extraction job
# (apps/api/src/jobs/extract-spin-frames.ts). Harmless on the web service,
# which shares this root-level Nixpacks config per docs/DEPLOY.md.
#
# nixPkgs listed explicitly because declaring [phases.setup] here replaces
# Nixpacks' auto-detected setup phase instead of merging with it — without
# this, node/pnpm silently disappear from PATH (`pnpm: command not found`).
[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]
aptPkgs = ["ffmpeg"]
